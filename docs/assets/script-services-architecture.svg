<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="932" viewBox="0 0 1440 932" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Script Services package layers</title>
<desc id="desc">Four layers. Tools (check, startest, craggy-script CLI) use the runtime (script). The runtime uses building blocks (modules, schema), which use foundations (dialect, values, types). External modules: go.starlark.net and google/jsonschema-go.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFB547" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="932" rx="20" fill="#111A20"/>
<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="53" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; SCRIPT SERVICES</text>
<text x="40" y="87" font-size="22" fill="#E4ECE7" font-weight="400" text-anchor="start">One Starlark runtime for every Craggy host</text>
<text x="1400" y="53" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="end">PACKAGE LAYERS</text>
<path d="M40 111 H1400" stroke="#2A2F2C" stroke-width="2"/>
<text x="40" y="180" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">01 / TOOLS</text>
<text x="40" y="210" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Built on the runtime</text>
<rect x="340" y="140" width="339" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 160 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="196" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">check</text>
<text x="362" y="228" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Static checks</text>
<rect x="701" y="140" width="339" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M723 160 H757" stroke="#FFB547" stroke-width="3"/>
<text x="723" y="196" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">startest</text>
<text x="723" y="228" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">*_test.star runner</text>
<rect x="1061" y="140" width="339" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M1083 160 H1117" stroke="#FFB547" stroke-width="3"/>
<text x="1083" y="196" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">craggy-script</text>
<text x="1083" y="228" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">CLI</text>
<path d="M870 258 V300" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="884" y="286.0" font-size="16" fill="#FFB547" font-weight="400" text-anchor="start">imports</text>
<text x="40" y="348" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">02 / RUNTIME</text>
<text x="40" y="378" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Runs programs</text>
<rect x="340" y="308" width="1060" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 328 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="364" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">script</text>
<text x="362" y="396" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Exec / limits / errors / digests</text>
<path d="M870 426 V468" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="884" y="454.0" font-size="16" fill="#FFB547" font-weight="400" text-anchor="start">imports</text>
<text x="40" y="516" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">03 / BUILDING BLOCKS</text>
<text x="40" y="546" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Loading and schemas</text>
<rect x="340" y="476" width="519" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 496 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="532" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">modules</text>
<text x="362" y="564" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">load() / cache / digests</text>
<rect x="881" y="476" width="519" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M903 496 H937" stroke="#FFB547" stroke-width="3"/>
<text x="903" y="532" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">schema</text>
<text x="903" y="564" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">schema.* for scripts</text>
<path d="M870 594 V636" stroke="#FFB547" stroke-width="2" marker-end="url(#arrow)"/>
<text x="884" y="622.0" font-size="16" fill="#FFB547" font-weight="400" text-anchor="start">imports</text>
<text x="40" y="684" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">04 / FOUNDATIONS</text>
<text x="40" y="714" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">No internal imports</text>
<rect x="340" y="644" width="308" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M362 664 H396" stroke="#FFB547" stroke-width="3"/>
<text x="362" y="700" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">dialect</text>
<text x="362" y="732" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">One syntax</text>
<rect x="670" y="644" width="308" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M692 664 H726" stroke="#FFB547" stroke-width="3"/>
<text x="692" y="700" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">values</text>
<text x="692" y="732" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">Starlark &lt;-&gt; JSON</text>
<rect x="1000" y="644" width="400" height="112" rx="12" fill="#16222A" stroke="#4A3F2C" stroke-width="1.5"/>
<path d="M1022 664 H1056" stroke="#FFB547" stroke-width="3"/>
<text x="1022" y="700" font-size="26" fill="#E4ECE7" font-weight="700" text-anchor="start">types</text>
<text x="1022" y="732" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">types.go -&gt; JSON Schema</text>
<path d="M340 772 H1400" stroke="#2A2F2C" stroke-width="2" stroke-dasharray="4 6"/>
<text x="40" y="816" font-size="17" fill="#FFB547" font-weight="400" text-anchor="start">EXTERNAL</text>
<text x="40" y="844" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Go modules</text>
<text x="340" y="816" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="start">go.starlark.net</text>
<text x="810" y="816" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">the interpreter</text>
<text x="340" y="844" font-size="18" fill="#E4ECE7" font-weight="400" text-anchor="start">google/jsonschema-go</text>
<text x="810" y="844" font-size="18" fill="#9DAAA3" font-weight="400" text-anchor="start">types, schema, check</text>
<text x="40" y="902" font-size="17" fill="#9DAAA3" font-weight="400" text-anchor="start">Each layer imports only layers below it.</text>
</g></svg>
